name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node24-linux-x64
            artifact: nb-plus-linux
          - os: windows-latest
            target: node24-win-x64
            artifact: nb-plus-win.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install webui dependencies
        run: npm ci
        working-directory: webui

      - name: Build webui
        run: npm run build
        working-directory: webui

      - name: Install server dependencies
        run: npm ci

      - name: Build with pkg
        run: npx @yao-pkg/pkg . --targets ${{ matrix.target }} --out-path dist --compress Zstd

      - name: Normalize output name
        shell: bash
        run: |
          ls -la dist/
          if ls dist/*win*.exe >/dev/null 2>&1; then
            mv $(ls dist/*win*.exe | head -1) dist/${{ matrix.artifact }}
          elif ls dist/nb-plus* >/dev/null 2>&1; then
            mv $(ls dist/nb-plus* | head -1) dist/${{ matrix.artifact }}
          else
            mv dist/* dist/${{ matrix.artifact }}
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        run: flutter build apk --release
        working-directory: mobile

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: |
          set +e
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build-ios.log
          FLUTTER_EXIT=${PIPESTATUS[0]}
          grep -A6 "Swift Compiler Error\|error: " build-ios.log | head -120
          exit $FLUTTER_EXIT

      - name: Package as IPA
        working-directory: mobile/build/ios/iphoneos
        run: |
          APP_NAME=$(ls -d *.app | head -1)
          mkdir -p Payload
          cp -R "$APP_NAME" Payload/
          zip -qr BiTunnel.ipa Payload
          ls -la BiTunnel.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BiTunnel.ipa
          path: mobile/build/ios/iphoneos/BiTunnel.ipa
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-android, build-ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: find artifacts -type f -exec ls -la {} \;

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true